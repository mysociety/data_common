[project]
name = "data-common"
version = "1.1.0"
description = "Shared tools for mySociety data repositories"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pandas>=2.2",
    "rich>=13.7",
]

[project.scripts]
dataset = "data_common.cli:dataset"
notebook = "data_common.cli:notebook"

[project.optional-dependencies]
dataset = [
    "click>=8.1,<9",
    "cookiecutter>=2.6",
    "duckdb>=1.1",
    "frictionless>=5",
    "geopandas>=1.0",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pyarrow>=14",
    "pytest>=8",
    "rich-click>=1.8",
    "ruamel-yaml>=0.18",
    "toml>=0.10",
    "tqdm>=4.66",
    "xlsxwriter>=3.0",
]
notebook = ["ipython>=8"]
render = [
    "beautifulsoup4>=4.12",
    "htmltabletomd>=1.0",
    "ipython-genutils>=0.2",
    "jinja2>=3.1",
    "lxml>=5",
    "nbconvert>=7",
    "nbformat>=5",
    "papermill>=2.5",
    "pypandoc>=1.13",
    "rich-click>=1.8",
    "ruamel-yaml>=0.18",
    "toml>=0.10",
    "traitlets>=5.14",
]
google = [
    "google-api-python-client>=2.199",
    "google-auth-httplib2>=0.4",
    "google-auth-oauthlib>=1.4.1",
]
charts = [
    "altair>=5.4",
    "pillow>=10",
    "requests>=2.32",
    "typing-extensions>=4.12",
    "vl-convert-python>=1.6",
]
analysis = [
    "altair>=5.4",
    "ipython>=8",
    "ipywidgets>=8",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "ptitprince>=0.2.5",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "seaborn>=0.13",
]
geo = [
    "geopandas>=1.0",
    "pyarrow>=14",
    "tqdm>=4.66",
]
db = [
    "duckdb>=1.1",
    "jinja2>=3.1",
    "toml>=0.10",
]
validation = ["pydantic>=2.3"]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2",
    "pyright>=1.1.248",
    "ruff>=0.6.1",
    "types-pillow>=10.2",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.13"]
build-backend = "uv_build"

[tool.pyright]
include = ["src/data_common"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "warning"
